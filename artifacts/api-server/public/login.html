<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #4f46e5; --accent-dark: #3730a3;
      --text: #111827; --muted: #6b7280;
      --border: #e5e7eb; --bg: #f9fafb;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 40px 36px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 56px; height: 56px; border-radius: 14px;
      background: var(--accent); display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .logo-icon svg { width: 28px; height: 28px; color: #fff; }
    h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 0.9rem; }
    .form { margin-top: 28px; display: flex; flex-direction: column; gap: 18px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text); display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
      border-radius: 10px; font-size: 0.95rem; font-family: inherit;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
    .btn {
      width: 100%; padding: 13px; background: var(--accent); color: #fff;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, transform 0.1s; margin-top: 4px;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: var(--border); color: var(--muted); cursor: default; }
    .error {
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; display: none;
    }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/>
        </svg>
      </div>
      <h1>Sign In</h1>
      <p class="subtitle">Enter your credentials to continue</p>
    </div>
    <div class="error" id="error"></div>
    <form class="form" id="loginForm">
      <div>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit" id="submitBtn">Sign In</button>
    </form>
    <div class="back"><a href="/">← Back to home</a></div>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include",
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Login failed");

        if (data.role === "admin") window.location.href = "/admin";
        else window.location.href = "/portal";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });
  </script>
</body>
</html>
