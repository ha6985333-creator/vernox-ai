<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 20px; padding: 40px 36px;
      width: 100%; max-width: 460px; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      text-align: center;
    }
    .icon { width: 64px; height: 64px; border-radius: 16px; background: #d1fae5; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .icon svg { width: 32px; height: 32px; color: #065f46; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #111827; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 0.95rem; line-height: 1.6; }
    .email { font-weight: 600; color: #111827; }
    .actions { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
    .btn {
      padding: 12px 20px; border-radius: 10px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; border: none; transition: background 0.15s; font-family: inherit; text-decoration: none; display: block;
    }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #3730a3; }
    .btn-ghost { background: transparent; color: #6b7280; border: 1px solid #e5e7eb; }
    .btn-ghost:hover { background: #f9fafb; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a5 5 0 1 1 0 10A5 5 0 0 1 12 2zm0 12c5.33 0 8 2.67 8 4v2H4v-2c0-1.33 2.67-4 8-4z"/></svg>
    </div>
    <h1>Welcome back!</h1>
    <p>You're signed in as <span class="email" id="userEmail">—</span>.</p>
    <p style="margin-top:10px;">Your account is active. Use the chat widget to talk to our AI assistant.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Open Chat Widget</a>
      <button class="btn btn-ghost" id="logoutBtn">Sign Out</button>
    </div>
  </div>
  <script>
    async function init() {
      const res = await fetch("/api/auth/me", { credentials: "include" });
      if (!res.ok) { window.location.href = "/login"; return; }
      const me = await res.json();
      if (me.role === "admin") { window.location.href = "/admin"; return; }
      document.getElementById("userEmail").textContent = me.email;
    }
    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
      window.location.href = "/login";
    });
    init();
  </script>
</body>
</html>
