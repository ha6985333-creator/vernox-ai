<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Vernox AI</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #4f46e5; --accent-dark: #3730a3;
      --text: #1a1a1a; --muted: #6b7280;
      --border: #e5e7eb; --bg: #f9fafb;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #1a1a1a;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .card {
      background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 36px 32px;
      width: 100%; max-width: 400px;
    }
    .logo { margin-bottom: 24px; }
    .logo-icon {
      width: 36px; height: 36px; border-radius: 6px;
      background: var(--accent); display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    .logo-icon svg { width: 20px; height: 20px; color: #fff; }
    .logo-icon img { width: 74%; height: 74%; object-fit: contain; display: block; }
    h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); margin-bottom: 4px; letter-spacing: -0.01em; }
    .subtitle { color: var(--muted); font-size: 0.875rem; }
    .form { margin-top: 24px; display: flex; flex-direction: column; gap: 16px; }
    label { font-size: 0.78rem; font-weight: 600; color: var(--text); display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.875rem; font-family: inherit;
      outline: none; transition: border-color 0.15s; color: var(--text);
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; padding: 10px; background: var(--accent); color: #fff;
      border: none; border-radius: 6px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s; margin-top: 4px; height: 40px;
      font-family: inherit;
    }
    .btn:hover { background: var(--accent-dark); }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .error {
      background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
      border-radius: 6px; padding: 10px 12px; font-size: 0.82rem; display: none;
    }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: var(--muted); text-decoration: none; font-size: 0.82rem; }
    .back a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">
        <img src="/logo.png" alt="Vernox AI" />
      </div>
      <h1>Sign In</h1>
      <p class="subtitle">Enter your credentials to continue</p>
    </div>
    <div class="error" id="error"></div>
    <form class="form" id="loginForm">
      <div>
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button class="btn" type="submit" id="submitBtn">Sign In</button>
    </form>
    <div class="back"><a href="/">← Back to home</a></div>
  </div>
  <script>
    const form = document.getElementById("loginForm");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.style.display = "block";
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorEl.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
          credentials: "include",
        });

        if (res.ok) {
          const data = await res.json();
          window.location.href = data.role === "admin" ? "/admin" : "/portal";
          return;
        }

        if (res.status === 401) {
          showError("Incorrect email or password. Please try again.");
          return;
        }

        showError("Something went wrong. Please try again.");
      } catch (_) {
        showError("Unable to connect. Please check your internet connection and try again.");
      }
    });
  </script>
</body>
</html>
