kind = "web"
previewPath = "/"
title = "Vernox AI – LeadBot"
version = "1.0.0"
id = "artifacts/main-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23303

[services.development]
run = "pnpm --filter @workspace/main-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/main-site", "run", "build" ]
publicDir = "artifacts/main-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/login"
to = "/login.html"

[[services.production.rewrites]]
from = "/buy"
to = "/buy.html"

[[services.production.rewrites]]
from = "/demo"
to = "/demo.html"

[[services.production.rewrites]]
from = "/admin"
to = "/admin/index.html"

[[services.production.rewrites]]
from = "/admin/*"
to = "/admin/index.html"

[[services.production.rewrites]]
from = "/portal"
to = "/portal/index.html"

[[services.production.rewrites]]
from = "/portal/*"
to = "/portal/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23303"
BASE_PATH = "/"
